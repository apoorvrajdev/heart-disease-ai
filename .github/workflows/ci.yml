name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate app.py imports cleanly
        run: |
          python -c "import app"

      - name: Validate model artifact loads
        run: |
          python -c "
          import joblib
          import numpy as np
          model = joblib.load('heart_disease_model.pkl')
          features = np.array([[40, 1, 0, 120, 200, 0, 1, 150, 0, 1.0, 1, 0]])
          pred = model.predict(features)
          proba = model.predict_proba(features)
          print('Prediction:', pred)
          print('Probability shape:', proba.shape)
          "

      - name: Validate notebook JSON integrity
        run: |
          python -c "
          import json
          with open('heart_disease_training.ipynb', 'r', encoding='utf-8') as f:
              nb = json.load(f)
          assert 'cells' in nb
          assert len(nb['cells']) > 0
          print('Notebook is valid JSON with', len(nb['cells']), 'cells')
          "
